<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Cidade Melhor</title>
  <meta name="description" content="Entre na sua conta do Cidade Melhor para reportar e acompanhar problemas urbanos.">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body>
  <div id="header"></div>

  <main class="auth">
    <aside class="auth-lateral" id="auth-lateral"></aside>

    <section class="auth-conteudo">
      <div class="auth-card">
        <h1>Bem-vindo de volta!</h1>
        <p class="auth-subtitulo">Entre para reportar problemas, confirmar relatos e acompanhar a sua cidade.</p>

        <form id="form-login" novalidate>
          <div class="campo">
            <label class="campo-label" for="email">E-mail</label>
            <div class="campo-com-icone" data-icone="mail">
              <input class="campo-input" type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
            </div>
            <p class="campo-erro" id="erro-email"></p>
          </div>

          <div class="campo">
            <label class="campo-label" for="senha">Senha</label>
            <div class="campo-com-icone" data-icone="lock">
              <input class="campo-input" type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
              <button type="button" class="btn-icone" data-mostrar-senha="senha" aria-label="Mostrar senha"></button>
            </div>
            <p class="campo-erro" id="erro-senha"></p>
          </div>

          <div class="auth-linha">
            <label class="checkbox"><input type="checkbox" id="lembrar" checked> Lembrar de mim</label>
            <button type="button" class="link-botao" id="esqueci-senha">Esqueci minha senha</button>
          </div>

          <div class="auth-alerta" id="erro-login" role="alert" hidden></div>

          <button type="submit" class="btn btn-primario btn-lg btn-bloco" id="botao-entrar">Entrar</button>
        </form>

        <p class="auth-rodape">Ainda não tem conta? <a href="cadastro.html" id="link-cadastro">Criar conta grátis</a></p>

        <div class="contas-demo" id="contas-demo"></div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@1.49.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
